.hero{padding:40px 0 20px}.hero .lead{max-width:68ch}.filters{position:sticky;top:51px;z-index:30;padding:13px 0;margin-bottom:24px;background:color-mix(in oklab,var(--bg) 90%,transparent);border-block:1px solid var(--line-soft);backdrop-filter:blur(12px)}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.control label{display:block;margin-bottom:5px;font-size:.74rem;font-weight:700;color:var(--ink-dim)}.control select{width:100%}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.count{font:700 .8rem var(--mono);color:var(--ink-dim)}

<body><a class="skip-link" href="#main">跳到主要内容</a>

<header class="hero wrap"><p class="row"><span class="pill">真实数据 + 离线内容</span><span class="pill" id="heroCount">载入中</span></p><h1>探索自然</h1><p class="lead">每个专题从一个现象出发，再追问科学家怎么知道。天气工坊现已上线；联网时读取公开数据，断网或用 <code>file://</code> 打开时仍有完整内容。</p></header>
<div class="filters no-print"><div class="wrap filter-grid" aria-label="自然专题筛选">
<div class="control"><label for="themeFilter">主题</label><select class="input" id="themeFilter" name="theme"><option value="all">全部主题</option><option value="science">综合科学</option><option value="space">太空</option><option value="biology">生命</option><option value="earth">地球与天气</option></select></div>
<div class="control"><label for="ageFilter">年龄</label><select class="input" id="ageFilter" name="age"><option value="all">全部年龄</option><option value="5">5–6 岁</option><option value="7">7–8 岁</option><option value="9">9–10 岁</option><option value="11">11–12 岁</option></select></div>
<div class="control"><label for="dataFilter">数据模式</label><select class="input" id="dataFilter" name="dataMode"><option value="all">全部模式</option><option value="live">可用公开数据</option><option value="offline">本地观察为主</option></select></div>
<div class="control"><label for="taskFilter">任务状态</label><select class="input" id="taskFilter" name="taskStatus"><option value="all">全部状态</option><option value="new">还没去过</option><option value="visited">去过</option><option value="completed">已完成</option><option value="discovery">有发现</option></select></div>
</div></div>
<main id="main" class="wrap"><section class="card random-entry no-print" aria-labelledby="randomTitle"><div><strong id="randomTitle">随机自然入口</strong><p id="randomTask" role="status" aria-live="polite">抽一个专题和一张开放式观察卡；它不会代替正式任务。</p></div><div class="random-actions"><button class="btn btn-primary" id="randomEntry" type="button">随机抽专题</button><a class="btn btn-ghost" id="randomGo" href="index.html" hidden>打开专题 →</a></div></section><div class="result-head"><span class="count" id="count" role="status" aria-live="polite"></span><button class="btn btn-ghost btn-sm no-print" type="button" id="resetFilters">清除筛选</button></div><div class="tgrid" id="grid"></div><p class="empty" id="empty" hidden>没有符合条件的专题，换个条件试试。</p></main>
<footer class="foot"><div class="wrap">专题目录由 data/explorations.js 提供。公开数据不可用时，各详情页使用内置数据。</div></footer>
<script src="../data/explorations.js"></script><script src="../data/playful.js"></script><script src="../assets/js/progress.js"></script><script src="../assets/js/playful.js"></script><script>
(function(){"use strict";var items=(window.EXPLORATIONS||[]).filter(function(x){return x.type==="nature"&&x.ready;}),labels={science:"综合科学",space:"太空",biology:"生命",earth:"地球与天气"},ids=["themeFilter","ageFilter","dataFilter","taskFilter"],controls=ids.map(function(id){return document.getElementById(id);});
function ages(t){var n=String(t).match(/\d+/g)||[];return[Number(n[0]||0),Number(n[1]||n[0]||99)];}function mode(x){return x.id.indexOf("human-body")>=0?"offline":"live";}function status(id){var d=Progress.all();return{visited:!!d.pages[id],completed:!!d.completions[id],discovery:!!d.notes[id]};}
function pass(x){var theme=controls[0].value,age=controls[1].value,data=controls[2].value,task=controls[3].value,a=ages(x.age),s=status(x.id);if(theme!=="all"&&x.subject!==theme)return false;if(age!=="all"&&!(a[0]<=Number(age)+1&&a[1]>=Number(age)))return false;if(data!=="all"&&mode(x)!==data)return false;if(task==="new"&&s.visited)return false;if(task!=="all"&&task!=="new"&&!s[task])return false;return true;}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}function render(){var grid=document.getElementById("grid"),shown=items.filter(pass);grid.textContent="";shown.forEach(function(x){var s=status(x.id),a=el("article","card topic"+(s.visited?" visited":"")),meta=el("div","meta"),states=el("div","states");a.appendChild(el("span","icon",x.icon));a.appendChild(el("h2",null,x.title));meta.appendChild(el("span","pill",labels[x.subject]||x.subject));meta.appendChild(el("span","pill",x.age+" 岁"));meta.appendChild(el("span","pill",mode(x)==="live"?"公开数据 + 离线回退":"本地观察"));a.appendChild(meta);[["去过",s.visited],["任务完成",s.completed],["有发现",s.discovery]].forEach(function(v){states.appendChild(el("span","state"+(v[1]?" on":""),(v[1]?"✓ ":"○ ")+v[0]));});a.appendChild(states);a.appendChild(el("p",null,x.description));a.appendChild(el("p","task","观察任务："+x.task));var play=el("div","playful-row"),friend=el("div"),sticker=el("div"),go=el("a","go","打开专题 →");a.setAttribute("data-playful-page",x.id);friend.setAttribute("data-playful-companion","");sticker.setAttribute("data-playful-sticker","");play.appendChild(friend);play.appendChild(sticker);a.appendChild(play);go.href=x.file;a.appendChild(go);grid.appendChild(a);});document.getElementById("count").textContent="显示 "+shown.length+" / "+items.length+" 个专题";document.getElementById("heroCount").textContent=items.length+" 个专题";document.getElementById("empty").hidden=shown.length>0;if(window.Playful)Playful.init(grid);}
controls.forEach(function(c){c.addEventListener("change",render);});document.getElementById("resetFilters").addEventListener("click",function(){controls.forEach(function(c){c.selectedIndex=0;});render();});document.getElementById("randomEntry").addEventListener("click",function(){var x=items[Math.floor(Math.random()*items.length)],task=Playful.randomTask(x.id),go=document.getElementById("randomGo");document.getElementById("randomTask").textContent=x.icon+" "+x.title+" · "+task.lead+"："+task.text;go.href=x.file;go.textContent="打开“"+x.title+"” →";go.hidden=false;});window.addEventListener("kids-stem:progress",render);render();})();
</script><script src="../assets/js/pwa.js"></script>
</body></html>
