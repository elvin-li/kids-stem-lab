<!doctype html>
<html lang="zh-CN" data-mode="kid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互动实验室 · 少儿数理启蒙</title>
<meta name="description" content="按学科、年龄、访问状态和预计时长筛选互动实验。">
<link rel="stylesheet" href="../assets/css/base.css?v=17">
<link rel="stylesheet" href="../assets/css/kid.css?v=17">
<link rel="stylesheet" href="../assets/css/print.css" media="print">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#fff8ec">

<style>
.hero{padding:40px 0 20px}.hero .lead{max-width:66ch}.filters{position:sticky;top:51px;z-index:30;padding:13px 0;margin-bottom:24px;background:color-mix(in oklab,var(--bg) 90%,transparent);border-block:1px solid var(--line-soft);backdrop-filter:blur(12px)}
.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.control label{display:block;margin-bottom:5px;font-size:.74rem;font-weight:700;color:var(--ink-dim)}.control select{width:100%}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.count{font:700 .8rem var(--mono);color:var(--ink-dim)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.lab{display:flex;flex-direction:column;gap:10px;padding:18px}.lab.visited{border-color:color-mix(in oklab,var(--sci) 42%,var(--line))}.lab h2{margin:0;font-size:1.1rem}.lab p{margin:0;font-size:.88rem;color:var(--ink-mid)}.lab .icon{font-size:1.8rem}.meta,.states{display:flex;flex-wrap:wrap;gap:6px}.state{font-size:.72rem;color:var(--ink-dim)}.state.on{color:var(--sci)}.task{padding-top:10px;border-top:1px dashed var(--line-soft)}.go{margin-top:auto;font-size:.82rem;font-weight:700}.empty{text-align:center;padding:45px;color:var(--ink-dim)}.random-entry{margin:0 0 16px;padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.random-entry p{margin:4px 0 0;color:var(--ink-mid)}.random-actions{display:flex;gap:8px;flex-wrap:wrap}.playful-row{display:grid;gap:8px}.playful-row .playful-companion{font-size:.8rem}
.theme-art{position:relative;display:grid;place-items:center;min-height:150px;overflow:hidden;border-radius:18px;background:linear-gradient(145deg,color-mix(in oklab,var(--card-tone,var(--math)) 22%,var(--surface)),color-mix(in oklab,var(--kit) 12%,var(--surface-2)));font-size:clamp(4.4rem,9vw,6.6rem);line-height:1}.theme-art::before,.theme-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in oklab,var(--card-tone,var(--math)) 18%,transparent)}.theme-art::before{width:92px;height:92px;left:8%;top:12%}.theme-art::after{width:54px;height:54px;right:10%;bottom:12%}.theme-art>span{position:relative;z-index:1;filter:drop-shadow(0 7px 5px rgba(0,0,0,.14))}.lab[data-subject="physics"]{--card-tone:var(--phys)}.lab[data-subject="code"]{--card-tone:var(--code)}.lab[data-subject="art"]{--card-tone:var(--kit)}.kid-age{align-self:flex-start}.kid-play{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:auto;border-radius:14px;background:var(--card-tone,var(--math));color:#fff;font-weight:900}.kid-play:hover{color:#fff;text-decoration:none;filter:brightness(1.06)}html[data-mode="kid"] .hero{padding:24px 0 12px;text-align:center}html[data-mode="kid"] .lab-grid{grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}html[data-mode="kid"] .lab{gap:12px;padding:14px}html[data-mode="kid"] .lab h2{text-align:center;font-size:1.25rem}html[data-mode="kid"] .theme-art{min-height:180px;border-radius:20px}html[data-mode="kid"] main{padding-bottom:28px}@media(max-width:720px){.filter-grid{grid-template-columns:1fr 1fr}.filters{top:0}}@media(max-width:430px){.filter-grid{grid-template-columns:1fr}.lab-grid{grid-template-columns:minmax(0,1fr)}.theme-art{min-height:165px}.lab{min-width:0}}

/* ---------- 图形优先层：大插画卡片 + 图形分类（4–5 岁看图就能选） ---------- */
.scene{display:block;width:100%;height:auto;border:3px solid color-mix(in srgb,var(--card-tone,var(--math)) 34%,var(--line));border-radius:22px;background:color-mix(in srgb,var(--card-tone,var(--math)) 9%,var(--surface));box-shadow:0 4px 0 color-mix(in srgb,var(--card-tone,var(--math)) 18%,rgba(120,84,42,.14))}
.scene .sc-sun{fill:color-mix(in srgb,var(--card-tone,var(--math)) 30%,#fff2cf)}
.scene .sc-cloud{fill:color-mix(in srgb,var(--card-tone,var(--math)) 13%,#ffffff)}
.scene .sc-hill-a{fill:color-mix(in srgb,var(--card-tone,var(--math)) 20%,var(--surface-2))}
.scene .sc-hill-b{fill:color-mix(in srgb,var(--card-tone,var(--math)) 34%,var(--surface-2))}
.scene-link{display:block;border-radius:22px;text-decoration:none}
.scene-link:hover .scene{border-color:var(--card-tone,var(--math))}
.scene-link:active .scene{transform:translateY(2px)}
.lab{border-top:6px solid color-mix(in srgb,var(--card-tone,var(--math)) 45%,var(--line))}
.lab[data-picked="true"]{border-color:var(--sci);box-shadow:0 0 0 4px color-mix(in srgb,var(--sci) 26%,transparent),0 6px 0 rgba(120,84,42,.12)}
.kid-choose{margin:0 0 18px}
.kid-choose-title{margin:0 0 6px;font-size:clamp(1.1rem,3.4vw,1.4rem)}
.kid-choose .kid-tiles{margin-top:10px}
.kid-dice-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;border:3px dashed var(--line);border-radius:26px;background:var(--surface)}
.kid-dice-say{margin:0;flex:1;min-width:min(180px,100%);font-size:1rem;font-weight:800;color:var(--ink-mid)}
.kid-total{margin:22px 0 0;text-align:center;font-size:.98rem;font-weight:800;color:var(--ink-dim)}
.kid-headline{margin:0 0 4px;text-align:center;font-size:clamp(1.05rem,3.2vw,1.28rem);font-weight:800;color:var(--ink-mid)}
html[data-mode="kid"] .lab .scene{border-radius:24px}
html[data-mode="kid"] .kid-play{min-height:60px;font-size:1.12rem;border-radius:999px}
@media print{.scene,.scene-link,.kid-dice-row,.kid-choose{display:none !important}}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<nav class="nav"><div class="nav-in wrap"><a class="brand" href="../index.html"><span class="brand-mark">K</span> 少儿数理启蒙</a><div class="row" aria-label="主导航">
<a class="nav-link" href="../index.html">资源库</a><a class="nav-link" href="../pages/paths.html">学习路径</a><a class="nav-link" href="../games/index.html" aria-current="page">互动实验</a><a class="nav-link" href="../nature/index.html">探索</a><a class="nav-link" href="../pages/progress.html">我的足迹</a><a class="nav-link" href="../pages/parents.html">家长指南</a>
</div></div></nav>
<header class="hero wrap"><p class="row"><span class="pill">打开就玩</span><span class="pill" data-audience="parent">无需注册</span><span class="pill" id="heroCount">载入中</span></p><h1><span data-audience="kid-only">选一个，马上玩！</span><span data-audience="parent">互动实验室</span></h1><p class="lead" data-audience="parent">把抽象概念变成可以拖、可以看、可以验证的实验。状态来自这台设备：去过、完成任务和写下发现是三件不同的事。</p></header>
<div class="filters no-print" data-audience="parent"><div class="wrap filter-grid" aria-label="实验筛选">
<div class="control"><label for="subjectFilter">学科</label><select class="input" id="subjectFilter" name="subject"><option value="all">全部学科</option><option value="math">数学</option><option value="physics">物理</option><option value="code">编程</option><option value="art">创意绘画</option></select></div>
<div class="control"><label for="ageFilter">年龄</label><select class="input" id="ageFilter" name="age"><option value="all">全部年龄</option><option value="5">5–6 岁</option><option value="7">7–8 岁</option><option value="9">9–10 岁</option><option value="11">11–12 岁</option></select></div>
<div class="control"><label for="statusFilter">访问状态</label><select class="input" id="statusFilter" name="status"><option value="all">全部状态</option><option value="new">还没去过</option><option value="visited">去过</option><option value="completed">已完成</option><option value="discovery">有发现</option></select></div>
<div class="control"><label for="durationFilter">预计时长</label><select class="input" id="durationFilter" name="duration"><option value="all">全部时长</option><option value="short">约 10 分钟</option><option value="medium">约 15 分钟</option></select></div>
</div></div>
<main id="main" class="wrap"><section class="kid-choose" data-audience="kid-only" aria-labelledby="kidChooseTitle"><h2 class="kid-choose-title" id="kidChooseTitle">想玩哪一种？</h2><p class="kid-headline">点一个大图</p><div class="kid-tiles" id="kidKinds" role="group" aria-labelledby="kidChooseTitle"></div></section><div class="kid-dice-row" data-audience="kid-only"><button class="kid-icon-btn" id="kidDice" type="button"><span class="kid-tile-art" aria-hidden="true">🎲</span>抽一个</button><p class="kid-dice-say" id="kidDiceSay" role="status" aria-live="polite">点骰子，帮你挑一个。</p><a class="btn btn-primary" id="kidDiceGo" href="index.html" hidden>去玩 →</a></div><section class="card random-entry no-print" data-audience="parent" aria-labelledby="randomTitle"><div><strong id="randomTitle">随机实验入口</strong><p id="randomTask" role="status" aria-live="polite">抽一个实验和一张开放式探险卡；它不会代替正式任务。</p></div><div class="random-actions"><button class="btn btn-primary" id="randomEntry" type="button">随机抽实验</button><a class="btn btn-ghost" id="randomGo" href="index.html" hidden>打开实验 →</a></div></section><div class="result-head" data-audience="parent"><span class="count" id="count" role="status" aria-live="polite"></span><button class="btn btn-ghost btn-sm no-print" id="resetFilters" type="button">清除筛选</button></div><div class="lab-grid" id="grid"></div><p class="kid-total" data-audience="kid-only" id="kidTotal">载入中</p><p class="empty" id="empty" hidden>这个组合下没有实验，换个条件试试。</p></main>
<footer class="foot" data-audience="parent"><div class="wrap">实验目录由 data/explorations.js 提供；记录仅保存在本机浏览器。</div></footer>
<script src="../data/explorations.js"></script><script src="../data/playful.js?v=17"></script><script src="../assets/js/progress.js?v=17"></script><script src="../assets/js/playful.js?v=17"></script>
<script>
(function(){"use strict";
var items=(window.EXPLORATIONS||[]).filter(function(x){return x.type==="experiment"&&x.ready;});
var labels={math:"数学",physics:"物理",code:"编程",art:"创意绘画"};
var controls=["subjectFilter","ageFilter","statusFilter","durationFilter"].map(function(id){return document.getElementById(id);});
function ages(text){var n=String(text).match(/\d+/g)||[];return [Number(n[0]||0),Number(n[1]||n[0]||99)];}
function minutes(x){return x.subject==="code"||x.subject==="physics"?15:10;}
function stateFor(id){var d=Progress.all();return {visited:!!d.pages[id],completed:!!d.completions[id],discovery:!!d.notes[id]};}
function pass(x){var a=ages(x.age),age=document.getElementById("ageFilter").value,status=document.getElementById("statusFilter").value,s=stateFor(x.id),duration=document.getElementById("durationFilter").value;
if(document.getElementById("subjectFilter").value!=="all"&&x.subject!==document.getElementById("subjectFilter").value)return false;
if(age!=="all"&&!(a[0]<=Number(age)+1&&a[1]>=Number(age)))return false;
if(status==="new"&&s.visited)return false;if(status!=="all"&&status!=="new"&&!s[status])return false;
if(duration==="short"&&minutes(x)>10)return false;if(duration==="medium"&&minutes(x)<=10)return false;return true;}
function node(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}

/* ---- 内联 SVG 插画：每张卡一幅“太阳 + 云 + 小山 + 大图形”的场景 ---- */
var NS="http://www.w3.org/2000/svg";
function sv(name,attrs){var n=document.createElementNS(NS,name);if(attrs)Object.keys(attrs).forEach(function(k){n.setAttribute(k,attrs[k]);});return n;}
var sceneWords={math:"数字和积木",physics:"会动的东西",code:"一步一步的指令",art:"颜色和画笔"};
function scene(x){
  var s=sv("svg",{viewBox:"0 0 300 170","class":"scene",role:"img",focusable:"false"});
  var t=sv("title");t.textContent=x.title;
  var d=sv("desc");d.textContent="一幅画：太阳、云朵和小山，中间是"+(sceneWords[x.subject]||"这个实验")+"的大图形。";
  s.appendChild(t);s.appendChild(d);
  s.appendChild(sv("circle",{"class":"sc-sun",cx:"254",cy:"34",r:"21"}));
  s.appendChild(sv("ellipse",{"class":"sc-cloud",cx:"58",cy:"36",rx:"33",ry:"15"}));
  s.appendChild(sv("ellipse",{"class":"sc-cloud",cx:"88",cy:"44",rx:"25",ry:"12"}));
  s.appendChild(sv("path",{"class":"sc-hill-a",d:"M-10 170 Q70 94 160 130 T310 106 L310 170 Z"}));
  s.appendChild(sv("path",{"class":"sc-hill-b",d:"M-10 170 Q90 128 180 150 T310 138 L310 170 Z"}));
  var e=sv("text",{x:"150",y:"100","text-anchor":"middle","dominant-baseline":"central","font-size":"64"});
  e.textContent=x.icon;s.appendChild(e);
  return s;
}

function render(){var grid=document.getElementById("grid"),shown=items.filter(pass);grid.textContent="";shown.forEach(function(x){var s=stateFor(x.id),a=node("article","card lab"+(s.visited?" visited":"")),h=node("h2",null,x.title),kidAge=node("span","pill kid-age",x.age+" 岁"),meta=node("div","meta");a.dataset.subject=x.subject;kidAge.setAttribute("data-audience","kid-only");meta.setAttribute("data-audience","parent");meta.appendChild(node("span","pill pill-"+(x.subject==="physics"?"phys":x.subject==="art"?"kit":x.subject),labels[x.subject]||x.subject));meta.appendChild(node("span","pill",x.age+" 岁"));meta.appendChild(node("span","pill","约 "+minutes(x)+" 分钟"));var st=node("div","states");st.setAttribute("data-audience","parent");[["去过",s.visited],["完成",s.completed],["有发现",s.discovery]].forEach(function(v){st.appendChild(node("span","state"+(v[1]?" on":""),(v[1]?"✓ ":"○ ")+v[0]));});var d=node("p",null,x.description),task=node("p","task","任务："+x.task),play=node("div","playful-row"),friend=node("div"),sticker=node("div"),go=node("a","go","打开实验 →"),kidGo=node("a","kid-play","马上玩 →");d.setAttribute("data-audience","parent");task.setAttribute("data-audience","parent");play.setAttribute("data-audience","parent");go.setAttribute("data-audience","parent");kidGo.setAttribute("data-audience","kid-only");a.setAttribute("data-playful-page",x.id);friend.setAttribute("data-playful-companion","");sticker.setAttribute("data-playful-sticker","");play.appendChild(friend);play.appendChild(sticker);go.href=x.file;kidGo.href=x.file;a.appendChild(scene(x));a.appendChild(h);a.appendChild(kidAge);a.appendChild(meta);a.appendChild(st);a.appendChild(d);a.appendChild(task);a.appendChild(play);a.appendChild(go);a.appendChild(kidGo);grid.appendChild(a);});document.getElementById("count").textContent="显示 "+shown.length+" / "+items.length+" 个实验";document.getElementById("heroCount").textContent=items.length+" 个实验";document.getElementById("kidTotal").textContent="一共 "+items.length+" 个实验";document.getElementById("empty").hidden=shown.length>0;if(window.Playful)Playful.init(grid);}

/* ---- 孩子用的图形分类带：点大图 → 真的改筛选并重绘 ---- */
var KINDS=[{v:"all",icon:"🌈",label:"全部"},{v:"math",icon:"🔢",label:"数数"},{v:"physics",icon:"🎢",label:"会动"},{v:"code",icon:"🐢",label:"指挥"},{v:"art",icon:"🎨",label:"画画"}];
var subjectSelect=document.getElementById("subjectFilter"),kindBox=document.getElementById("kidKinds"),kindButtons=[];
KINDS.forEach(function(k){
  var b=node("button","kid-tile");b.type="button";b.setAttribute("data-value",k.v);
  b.setAttribute("aria-pressed",k.v==="all"?"true":"false");
  b.setAttribute("aria-label",k.label+"（"+(k.v==="all"?"显示全部实验":labels[k.v]+"类实验")+"）");
  var art=node("span","kid-tile-art",k.icon);art.setAttribute("aria-hidden","true");
  b.appendChild(art);b.appendChild(node("span","kid-tile-label",k.label));
  b.addEventListener("click",function(){
    subjectSelect.value=k.v;
    kindButtons.forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false");});
    render();
  });
  kindButtons.push(b);kindBox.appendChild(b);
});

/* ---- 骰子：抽一个实验，说出名字并打开“去玩”链接 ---- */
document.getElementById("kidDice").addEventListener("click",function(){
  var x=items[Math.floor(Math.random()*items.length)],say=document.getElementById("kidDiceSay"),go=document.getElementById("kidDiceGo");
  if(!x)return;
  say.textContent=x.icon+" "+x.title;
  go.href=x.file;go.hidden=false;go.setAttribute("aria-label","去玩"+x.title);
  var card=document.querySelector('.lab[data-playful-page="'+x.id+'"]');
  Array.prototype.forEach.call(document.querySelectorAll(".lab[data-picked]"),function(n){n.removeAttribute("data-picked");});
  if(card){card.setAttribute("data-picked","true");card.scrollIntoView({block:"center"});}
});

controls.forEach(function(c){c.addEventListener("change",function(){
  kindButtons.forEach(function(o){o.setAttribute("aria-pressed",o.getAttribute("data-value")===subjectSelect.value?"true":"false");});
  render();
});});
document.getElementById("resetFilters").addEventListener("click",function(){controls.forEach(function(c){c.selectedIndex=0;});kindButtons.forEach(function(o){o.setAttribute("aria-pressed",o.getAttribute("data-value")==="all"?"true":"false");});render();});
document.getElementById("randomEntry").addEventListener("click",function(){var x=items[Math.floor(Math.random()*items.length)],task=Playful.randomTask(x.id),go=document.getElementById("randomGo");document.getElementById("randomTask").textContent=x.icon+" "+x.title+" · "+task.lead+"："+task.text;go.href=x.file;go.textContent="打开“"+x.title+"” →";go.hidden=false;});
/* ---- 支持从首页色带深链接进来：?kind=math|physics|code|art ---- */
(function(){
  var m=String(location.search||"").match(/[?&]kind=([a-z]+)/i);
  if(!m)return;
  var want=m[1].toLowerCase(),ok=false,i;
  for(i=0;i<subjectSelect.options.length;i++){if(subjectSelect.options[i].value===want)ok=true;}
  if(!ok)return;
  subjectSelect.value=want;
  kindButtons.forEach(function(o){o.setAttribute("aria-pressed",o.getAttribute("data-value")===want?"true":"false");});
})();
window.addEventListener("kids-stem:progress",render);render();
})();
</script><script src="../assets/js/pwa.js?v=17"></script>
</body></html>
