<style>
.hero{padding:40px 0 20px}.hero .lead{max-width:66ch}.filters{position:sticky;top:51px;z-index:30;padding:13px 0;margin-bottom:24px;background:color-mix(in oklab,var(--bg) 90%,transparent);border-block:1px solid var(--line-soft);backdrop-filter:blur(12px)}
.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.control label{display:block;margin-bottom:5px;font-size:.74rem;font-weight:700;color:var(--ink-dim)}.control select{width:100%}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.count{font:700 .8rem var(--mono);color:var(--ink-dim)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.lab{display:flex;flex-direction:column;gap:10px;padding:18px}.lab.visited{border-color:color-mix(in oklab,var(--sci) 42%,var(--line))}.lab h2{margin:0;font-size:1.1rem}.lab p{margin:0;font-size:.88rem;color:var(--ink-mid)}.lab .icon{font-size:1.8rem}.meta,.states{display:flex;flex-wrap:wrap;gap:6px}.state{font-size:.72rem;color:var(--ink-dim)}.state.on{color:var(--sci)}.task{padding-top:10px;border-top:1px dashed var(--line-soft)}.go{margin-top:auto;font-size:.82rem;font-weight:700}.empty{text-align:center;padding:45px;color:var(--ink-dim)}.random-entry{margin:0 0 16px;padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.random-entry p{margin:4px 0 0;color:var(--ink-mid)}.random-actions{display:flex;gap:8px;flex-wrap:wrap}.playful-row{display:grid;gap:8px}.playful-row .playful-companion{font-size:.8rem}
.theme-art{position:relative;display:grid;place-items:center;min-height:150px;overflow:hidden;border-radius:18px;background:linear-gradient(145deg,color-mix(in oklab,var(--card-tone,var(--math)) 22%,var(--surface)),color-mix(in oklab,var(--kit) 12%,var(--surface-2)));font-size:clamp(4.4rem,9vw,6.6rem);line-height:1}.theme-art::before,.theme-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in oklab,var(--card-tone,var(--math)) 18%,transparent)}.theme-art::before{width:92px;height:92px;left:8%;top:12%}.theme-art::after{width:54px;height:54px;right:10%;bottom:12%}.theme-art>span{position:relative;z-index:1;filter:drop-shadow(0 7px 5px rgba(0,0,0,.14))}
/* 有场景插画时插画自己就是整块图位：铺满、盖掉 emoji 占位用的字号和两个装饰圆。
   图位还得锁成卡片画自己的 160 × 110。这些插画是 slice 铺满的，图位比 16:11 更扁时
   裁掉的就是上下两条；而「对折能重合」「每次都多 1 格」这些说明正写在画面的底边和顶边，
   固定 180px 高的图位在手机上宽高比接近 2.0，它们一直是断了一半的。 */
.theme-art.has-scene{width:100%;font-size:0;aspect-ratio:16/11;min-height:0}.theme-art.has-scene::before,.theme-art.has-scene::after{display:none}.theme-art.has-scene svg{position:absolute;inset:0;width:100%;height:100%}.lab[data-subject="physics"]{--card-tone:var(--phys)}.lab[data-subject="code"]{--card-tone:var(--code)}.lab[data-subject="art"]{--card-tone:var(--kit)}.kid-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* 孩子模式原来只靠 .lab.visited 那圈边框颜色表示「去过」，完成状态干脆不显示：
   既是纯颜色信号，也把契约要求的完成状态漏掉了。玩过和完成任务各给一句话。
   学科色都是按 --surface-2 校过的，所以底色沿用 .pill 自己的那一档，
   再往里掺绿会把 4.6:1 压到 4.0。 */
.kid-state{color:var(--sci);border-color:color-mix(in srgb,var(--sci) 42%,var(--line-soft))}.kid-play{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:auto;border-radius:14px;background:var(--card-tone,var(--math));color:#fff;font-weight:900}.kid-play:hover{color:#fff;text-decoration:none;filter:brightness(1.06)}html[data-mode="kid"] .hero{padding:24px 0 12px;text-align:center}html[data-mode="kid"] .lab-grid{grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}html[data-mode="kid"] .lab{gap:12px;padding:14px}html[data-mode="kid"] .lab h2{text-align:center;font-size:1.25rem}html[data-mode="kid"] .theme-art{min-height:180px;border-radius:20px}html[data-mode="kid"] .theme-art.has-scene{min-height:0}html[data-mode="kid"] main{padding-bottom:28px}@media(max-width:720px){.filter-grid{grid-template-columns:1fr 1fr}.filters{top:0}}@media(max-width:430px){.filter-grid{grid-template-columns:1fr}.lab-grid{grid-template-columns:minmax(0,1fr)}.theme-art{min-height:165px}.lab{min-width:0}}
</style>

<header class="hero wrap"><p class="row"><span class="pill">打开就玩</span><span class="pill" data-audience="parent">无需注册</span><span class="pill" id="heroCount">载入中</span></p><h1><span data-audience="kid-only">选一个，马上玩！</span><span data-audience="parent">互动实验室</span></h1><p class="lead" data-audience="parent">把抽象概念变成可以拖、可以看、可以验证的实验。状态来自这台设备：去过、完成任务和写下发现是三件不同的事。</p></header>
<div class="filters no-print" data-audience="parent"><div class="wrap filter-grid" aria-label="实验筛选">
<div class="control"><label for="subjectFilter">学科</label><select class="input" id="subjectFilter" name="subject"><option value="all">全部学科</option><option value="math">数学</option><option value="physics">物理</option><option value="code">编程</option><option value="art">创意绘画</option></select></div>
<div class="control"><label for="ageFilter">年龄</label><select class="input" id="ageFilter" name="age"><option value="all">全部年龄</option><option value="5">5–6 岁</option><option value="7">7–8 岁</option><option value="9">9–10 岁</option><option value="11">11–12 岁</option></select></div>
<div class="control"><label for="statusFilter">访问状态</label><select class="input" id="statusFilter" name="status"><option value="all">全部状态</option><option value="new">还没去过</option><option value="visited">去过</option><option value="completed">已完成</option><option value="discovery">有发现</option></select></div>
<div class="control"><label for="durationFilter">预计时长</label><select class="input" id="durationFilter" name="duration"><option value="all">全部时长</option><option value="short">约 10 分钟</option><option value="medium">约 15 分钟</option></select></div>
</div></div>
<main id="main" class="wrap"><section class="card random-entry no-print" data-audience="parent" aria-labelledby="randomTitle"><div><strong id="randomTitle">随机实验入口</strong><p id="randomTask" role="status" aria-live="polite">抽一个实验和一张开放式探险卡；它不会代替正式任务。</p></div><div class="random-actions"><button class="btn btn-primary" id="randomEntry" type="button">随机抽实验</button><a class="btn btn-ghost" id="randomGo" href="index.html" hidden>打开实验 →</a></div></section><div class="result-head" data-audience="parent"><span class="count" id="count" role="status" aria-live="polite"></span><button class="btn btn-ghost btn-sm no-print" id="resetFilters" type="button">清除筛选</button></div><div class="lab-grid" id="grid"></div><p class="empty" id="empty" hidden>这个组合下没有实验，换个条件试试。</p></main>
<footer class="foot" data-audience="parent"><div class="wrap">实验目录由 data/explorations.js 提供；记录仅保存在本机浏览器。</div></footer>
<script src="../data/explorations.js?v=77"></script><script src="../assets/js/illustrations.js?v=77"></script><script src="../data/playful.js?v=77"></script><script src="../assets/js/progress.js?v=77"></script><script src="../assets/js/playful.js?v=77"></script>
<script>
(function(){"use strict";
var items=(window.EXPLORATIONS||[]).filter(function(x){return x.type==="experiment"&&x.ready;});
var labels={math:"数学",physics:"物理",code:"编程",art:"创意绘画"};
var controls=["subjectFilter","ageFilter","statusFilter","durationFilter"].map(function(id){return document.getElementById(id);});
function ages(text){var n=String(text).match(/\d+/g)||[];return [Number(n[0]||0),Number(n[1]||n[0]||99)];}
function minutes(x){return x.subject==="code"||x.subject==="physics"?15:10;}
/* 首页同一处已经承认 progress.js 可能没加载成（缓存残缺等），这里却裸调
   Progress.all()：同样情况下 render 在第一张卡上就抛 TypeError，整个目录
   一张卡都画不出来，顶上的计数也停在「载入中」。目录本身不依赖足迹，
   读不到就当全部「还没去过」。 */
function stateFor(id){var d=window.Progress?Progress.all():{pages:{},completions:{},notes:{}};return {visited:!!d.pages[id],completed:!!d.completions[id],discovery:!!d.notes[id]};}
function pass(x){var a=ages(x.age),age=document.getElementById("ageFilter").value,status=document.getElementById("statusFilter").value,s=stateFor(x.id),duration=document.getElementById("durationFilter").value;
if(document.getElementById("subjectFilter").value!=="all"&&x.subject!==document.getElementById("subjectFilter").value)return false;
if(age!=="all"&&!(a[0]<=Number(age)+1&&a[1]>=Number(age)))return false;
if(status==="new"&&s.visited)return false;if(status!=="all"&&status!=="new"&&!s[status])return false;
if(duration==="short"&&minutes(x)>10)return false;if(duration==="medium"&&minutes(x)<=10)return false;return true;}
function node(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function render(){var grid=document.getElementById("grid"),shown=items.filter(pass);grid.textContent="";shown.forEach(function(x){var s=stateFor(x.id),a=node("article","card lab"+(s.visited?" visited":"")),art=node("div","theme-art"),artIcon=node("span",null,x.icon),icon=node("span","icon",x.icon),h=node("h2",null,x.title),kidAge=node("span","pill kid-age",x.age+" 岁"),kidTags=node("div","kid-tags"),meta=node("div","meta");a.dataset.subject=x.subject;art.setAttribute("data-audience","kid-only");art.setAttribute("aria-hidden","true");var slug=x.file.replace(/\.html$/,"");if(window.ILLUSTRATIONS&&ILLUSTRATIONS.hasArt("card/"+slug)){art.classList.add("has-scene");art.insertAdjacentHTML("beforeend",ILLUSTRATIONS.art("card/"+slug,{decorative:true}));}else{if(window.ILLUSTRATIONS&&ILLUSTRATIONS.tileIcon){var svg=ILLUSTRATIONS.tileIcon(slug);if(svg){artIcon.innerHTML=svg;artIcon.style.fontSize="0";}}art.appendChild(artIcon);}kidTags.setAttribute("data-audience","kid-only");kidTags.appendChild(kidAge);if(s.completed||s.visited)kidTags.appendChild(node("span","pill kid-state",s.completed?"✓ 任务已完成":"✓ 玩过了"));icon.setAttribute("data-audience","parent");meta.setAttribute("data-audience","parent");meta.appendChild(node("span","pill pill-"+(x.subject==="physics"?"phys":x.subject==="art"?"kit":x.subject),labels[x.subject]||x.subject));meta.appendChild(node("span","pill",x.age+" 岁"));meta.appendChild(node("span","pill","约 "+minutes(x)+" 分钟"));var st=node("div","states");st.setAttribute("data-audience","parent");[["去过",s.visited],["完成",s.completed],["有发现",s.discovery]].forEach(function(v){st.appendChild(node("span","state"+(v[1]?" on":""),(v[1]?"✓ ":"○ ")+v[0]));});var d=node("p",null,x.description),task=node("p","task","任务："+x.task),play=node("div","playful-row"),friend=node("div"),sticker=node("div"),go=node("a","go","打开实验 →"),kidGo=node("a","kid-play","马上玩 →");d.setAttribute("data-audience","parent");task.setAttribute("data-audience","parent");play.setAttribute("data-audience","parent");go.setAttribute("data-audience","parent");kidGo.setAttribute("data-audience","kid-only");a.setAttribute("data-playful-page",x.id);friend.setAttribute("data-playful-companion","");sticker.setAttribute("data-playful-sticker","");play.appendChild(friend);play.appendChild(sticker);go.href=x.file;kidGo.href=x.file;a.appendChild(art);a.appendChild(icon);a.appendChild(h);a.appendChild(kidTags);a.appendChild(meta);a.appendChild(st);a.appendChild(d);a.appendChild(task);a.appendChild(play);a.appendChild(go);a.appendChild(kidGo);grid.appendChild(a);});document.getElementById("count").textContent="显示 "+shown.length+" / "+items.length+" 个实验";document.getElementById("heroCount").textContent=items.length+" 个实验";document.getElementById("empty").hidden=shown.length>0;if(window.Playful)Playful.init(grid);}
controls.forEach(function(c){c.addEventListener("change",render);});document.getElementById("resetFilters").addEventListener("click",function(){controls.forEach(function(c){c.selectedIndex=0;});render();});document.getElementById("randomEntry").addEventListener("click",function(){
/* 抽签得在筛选之后的那一堆里抽。筛选条就在这个按钮正上方，还写着「显示 3 / 11 个实验」，
   从全部 11 个里抽会抽出一个屏幕上根本看不到的实验——筛成「数学 · 5–6 岁」也能抽到
   11 岁的物理。筛没了就退回全部，总得抽出一个来。 */
var pool=items.filter(pass);if(!pool.length)pool=items;
var x=pool[Math.floor(Math.random()*pool.length)],go=document.getElementById("randomGo");
/* 渲染那边已经守着 window.Playful 了，这里少一道守卫：童趣层没加载时点一下就抛异常，
   连带把「打开实验」的链接也设不上。抽到的实验本身不依赖童趣层。 */
var task=window.Playful&&Playful.randomTask?Playful.randomTask(x.id):null;
document.getElementById("randomTask").textContent=task?x.icon+" "+x.title+" · "+task.lead+"："+task.text:x.icon+" "+x.title+" · 任务："+x.task;go.href=x.file;go.textContent="打开“"+x.title+"” →";go.hidden=false;});window.addEventListener("kids-stem:progress",render);
/* 从实验页按「返回」回来时，浏览器在 load 之后、pageshow 之前才把四个筛选下拉
   恢复成上次的选择，而且一个事件也不发：下拉写着「数学」，网格里摆的却是刚才
   按默认「全部学科」画好的 11 张卡——筛选器和结果各说各话；bfcache 整页复活时
   「去过／完成」的状态角标也停在离开前那一刻（进度事件发生在实验页的窗口里，
   这边听不到）。专题目录页早补过同一步：按恢复后的筛选和最新足迹重画一次即可；
   首次打开是 navigate，render() 在下面照常跑，不用重复。
   重画之前还得先把模式对齐：本页的筛选条、随机入口、卡片上的「打开实验」和
   「马上玩」都分孩子/家长两层，bfcache 整页复活时 <html data-mode> 冻着出发前的
   值——在实验页里切过模式再返回，目录还按旧模式摆整页，导航里的模式下拉也停在
   旧值；十一个实验页、首页和足迹页复活时都由 Playful.syncPreferences 按存好的
   偏好重对齐，目录这页一直漏着。 */
window.addEventListener("pageshow",function(event){var nav=performance.getEntriesByType?performance.getEntriesByType("navigation")[0]:null;if(event.persisted||(nav&&(nav.type==="back_forward"||nav.type==="reload"))){if(window.Playful&&Playful.syncPreferences)Playful.syncPreferences(document);render();}});
render();
})();
</script><script src="../assets/js/pwa.js?v=77"></script>
