<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互动实验室 · 少儿数理启蒙</title>
<meta name="description" content="按学科、年龄、访问状态和预计时长筛选互动实验。">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/kid.css">
<link rel="stylesheet" href="../assets/css/print.css" media="print">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="../assets/icons/app-icon.svg" type="image/svg+xml">
<style>
.hero{padding:40px 0 20px}.hero .lead{max-width:66ch}.filters{position:sticky;top:51px;z-index:30;padding:13px 0;margin-bottom:24px;background:color-mix(in oklab,var(--bg) 90%,transparent);border-block:1px solid var(--line-soft);backdrop-filter:blur(12px)}
.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.control label{display:block;margin-bottom:5px;font-size:.74rem;font-weight:700;color:var(--ink-dim)}.control select{width:100%}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.count{font:700 .8rem var(--mono);color:var(--ink-dim)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.lab{display:flex;flex-direction:column;gap:10px;padding:18px}.lab.visited{border-color:color-mix(in oklab,var(--sci) 42%,var(--line))}.lab h2{margin:0;font-size:1.1rem}.lab p{margin:0;font-size:.88rem;color:var(--ink-mid)}.lab .icon{font-size:1.8rem}.meta,.states{display:flex;flex-wrap:wrap;gap:6px}.state{font-size:.72rem;color:var(--ink-dim)}.state.on{color:var(--sci)}.task{padding-top:10px;border-top:1px dashed var(--line-soft)}.go{margin-top:auto;font-size:.82rem;font-weight:700}.empty{text-align:center;padding:45px;color:var(--ink-dim)}.random-entry{margin:0 0 16px;padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.random-entry p{margin:4px 0 0;color:var(--ink-mid)}.random-actions{display:flex;gap:8px;flex-wrap:wrap}.playful-row{display:grid;gap:8px}.playful-row .playful-companion{font-size:.8rem}
@media(max-width:720px){.filter-grid{grid-template-columns:1fr 1fr}.filters{top:0}}@media(max-width:430px){.filter-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<nav class="nav"><div class="nav-in wrap"><a class="brand" href="../index.html"><span class="brand-mark">K</span> 少儿数理启蒙</a><div class="row" aria-label="主导航">
<a class="nav-link" href="../index.html">资源库</a><a class="nav-link" href="../pages/paths.html">学习路径</a><a class="nav-link" href="../games/index.html" aria-current="page">互动实验</a><a class="nav-link" href="../nature/index.html">探索</a><a class="nav-link" href="../pages/progress.html">我的足迹</a><a class="nav-link" href="../pages/parents.html">家长指南</a>
</div></div></nav>
<header class="hero wrap"><p class="row"><span class="pill">打开就玩</span><span class="pill">无需注册</span><span class="pill" id="heroCount">载入中</span></p><h1>互动实验室</h1><p class="lead">把抽象概念变成可以拖、可以看、可以验证的实验。状态来自这台设备：去过、完成任务和写下发现是三件不同的事。</p></header>
<div class="filters no-print"><div class="wrap filter-grid" aria-label="实验筛选">
<div class="control"><label for="subjectFilter">学科</label><select class="input" id="subjectFilter" name="subject"><option value="all">全部学科</option><option value="math">数学</option><option value="physics">物理</option><option value="code">编程</option></select></div>
<div class="control"><label for="ageFilter">年龄</label><select class="input" id="ageFilter" name="age"><option value="all">全部年龄</option><option value="5">5–6 岁</option><option value="7">7–8 岁</option><option value="9">9–10 岁</option><option value="11">11–12 岁</option></select></div>
<div class="control"><label for="statusFilter">访问状态</label><select class="input" id="statusFilter" name="status"><option value="all">全部状态</option><option value="new">还没去过</option><option value="visited">去过</option><option value="completed">已完成</option><option value="discovery">有发现</option></select></div>
<div class="control"><label for="durationFilter">预计时长</label><select class="input" id="durationFilter" name="duration"><option value="all">全部时长</option><option value="short">约 10 分钟</option><option value="medium">约 15 分钟</option></select></div>
</div></div>
<main id="main" class="wrap"><section class="card random-entry no-print" aria-labelledby="randomTitle"><div><strong id="randomTitle">随机实验入口</strong><p id="randomTask" role="status" aria-live="polite">抽一个实验和一张开放式探险卡；它不会代替正式任务。</p></div><div class="random-actions"><button class="btn btn-primary" id="randomEntry" type="button">随机抽实验</button><a class="btn btn-ghost" id="randomGo" href="index.html" hidden>打开实验 →</a></div></section><div class="result-head"><span class="count" id="count" role="status" aria-live="polite"></span><button class="btn btn-ghost btn-sm no-print" id="resetFilters" type="button">清除筛选</button></div><div class="lab-grid" id="grid"></div><p class="empty" id="empty" hidden>这个组合下没有实验，换个条件试试。</p></main>
<footer class="foot"><div class="wrap">实验目录由 data/explorations.js 提供；记录仅保存在本机浏览器。</div></footer>
<script src="../data/explorations.js"></script><script src="../data/playful.js"></script><script src="../assets/js/progress.js"></script><script src="../assets/js/playful.js"></script>
<script>
(function(){"use strict";
var items=(window.EXPLORATIONS||[]).filter(function(x){return x.type==="experiment"&&x.ready;});
var labels={math:"数学",physics:"物理",code:"编程"};
var controls=["subjectFilter","ageFilter","statusFilter","durationFilter"].map(function(id){return document.getElementById(id);});
function ages(text){var n=String(text).match(/\d+/g)||[];return [Number(n[0]||0),Number(n[1]||n[0]||99)];}
function minutes(x){return x.subject==="code"||x.subject==="physics"?15:10;}
function stateFor(id){var d=Progress.all();return {visited:!!d.pages[id],completed:!!d.completions[id],discovery:!!d.notes[id]};}
function pass(x){var a=ages(x.age),age=document.getElementById("ageFilter").value,status=document.getElementById("statusFilter").value,s=stateFor(x.id),duration=document.getElementById("durationFilter").value;
if(document.getElementById("subjectFilter").value!=="all"&&x.subject!==document.getElementById("subjectFilter").value)return false;
if(age!=="all"&&!(a[0]<=Number(age)+1&&a[1]>=Number(age)))return false;
if(status==="new"&&s.visited)return false;if(status!=="all"&&status!=="new"&&!s[status])return false;
if(duration==="short"&&minutes(x)>10)return false;if(duration==="medium"&&minutes(x)<=10)return false;return true;}
function node(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function render(){var grid=document.getElementById("grid"),shown=items.filter(pass);grid.textContent="";shown.forEach(function(x){var s=stateFor(x.id),a=node("article","card lab"+(s.visited?" visited":"")),icon=node("span","icon",x.icon),h=node("h2",null,x.title),meta=node("div","meta");meta.appendChild(node("span","pill pill-"+(x.subject==="physics"?"phys":x.subject),labels[x.subject]||x.subject));meta.appendChild(node("span","pill",x.age+" 岁"));meta.appendChild(node("span","pill","约 "+minutes(x)+" 分钟"));var st=node("div","states");[["去过",s.visited],["完成",s.completed],["有发现",s.discovery]].forEach(function(v){st.appendChild(node("span","state"+(v[1]?" on":""),(v[1]?"✓ ":"○ ")+v[0]));});var d=node("p",null,x.description),task=node("p","task","任务："+x.task),play=node("div","playful-row"),friend=node("div"),sticker=node("div"),go=node("a","go","打开实验 →");a.setAttribute("data-playful-page",x.id);friend.setAttribute("data-playful-companion","");sticker.setAttribute("data-playful-sticker","");play.appendChild(friend);play.appendChild(sticker);go.href=x.file;a.appendChild(icon);a.appendChild(h);a.appendChild(meta);a.appendChild(st);a.appendChild(d);a.appendChild(task);a.appendChild(play);a.appendChild(go);grid.appendChild(a);});document.getElementById("count").textContent="显示 "+shown.length+" / "+items.length+" 个实验";document.getElementById("heroCount").textContent=items.length+" 个实验";document.getElementById("empty").hidden=shown.length>0;if(window.Playful)Playful.init(grid);}
controls.forEach(function(c){c.addEventListener("change",render);});document.getElementById("resetFilters").addEventListener("click",function(){controls.forEach(function(c){c.selectedIndex=0;});render();});document.getElementById("randomEntry").addEventListener("click",function(){var x=items[Math.floor(Math.random()*items.length)],task=Playful.randomTask(x.id),go=document.getElementById("randomGo");document.getElementById("randomTask").textContent=x.icon+" "+x.title+" · "+task.lead+"："+task.text;go.href=x.file;go.textContent="打开“"+x.title+"” →";go.hidden=false;});window.addEventListener("kids-stem:progress",render);render();
})();
</script><script src="../assets/js/pwa.js"></script>
</body></html>
