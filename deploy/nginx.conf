# 少儿数理启蒙 · 独立 nginx 配置
#
# 有意做成自包含的一份配置，用 -c 指定运行，不去改 Homebrew 的 nginx.conf：
#   启动  nginx -c /Users/a0000/Services/早教/deploy/nginx.conf
#   校验  nginx -t -c /Users/a0000/Services/早教/deploy/nginx.conf
#   重载  nginx -s reload -c /Users/a0000/Services/早教/deploy/nginx.conf
#   停止  nginx -s stop   -c /Users/a0000/Services/早教/deploy/nginx.conf
#
# 为什么不写进 /opt/homebrew/etc/nginx/nginx.conf：那份配置里的默认 server 监听 8080，
# 而本机 8080 已经被别的进程占用，一旦跟着它一起启动会直接 bind 失败。自包含配置
# 既不动别人的文件，也不受那个端口冲突影响，停掉就干净了。
#
# 运行期文件（pid / 日志 / 临时目录）全部放在站点根目录之外。
# 放在 root 里会被当成静态文件对外提供 —— 访问 /deploy/access.log 就能读到日志。

worker_processes  1;
error_log  /tmp/zaojiao-nginx/error.log warn;
pid        /tmp/zaojiao-nginx/nginx.pid;

events { worker_connections  256; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    # nginx 自带的 mime.types 没有 webmanifest（已核对过）。
    # 缺这一条时 manifest 会以 application/octet-stream 下发，PWA 安装横幅不出现。
    types {
        application/manifest+json  webmanifest;
    }
    default_type  application/octet-stream;

    charset       utf-8;
    # text/html 已在 charset_types 的默认值里，重复写会让 nginx -t 报 duplicate 警告
    charset_types text/css application/javascript application/manifest+json
                  image/svg+xml text/plain;

    access_log    /tmp/zaojiao-nginx/access.log;
    client_body_temp_path /tmp/zaojiao-nginx/client_body;
    proxy_temp_path       /tmp/zaojiao-nginx/proxy;
    fastcgi_temp_path     /tmp/zaojiao-nginx/fastcgi;
    uwsgi_temp_path       /tmp/zaojiao-nginx/uwsgi;
    scgi_temp_path        /tmp/zaojiao-nginx/scgi;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;

    server {
        # 只绑回环。Service Worker 要求安全上下文，而 127.0.0.1 与 localhost 本身
        # 就算安全上下文，所以本机 http 不用证书也能装上离线壳。
        # 要在局域网上访问，见文件末尾的说明——那时必须上 HTTPS，否则 SW 不注册。
        listen       127.0.0.1:8088;
        server_name  localhost 127.0.0.1;

        root         "/Users/a0000/Services/早教";
        index        index.html;
        autoindex    off;
        # 非标准端口下，/pages 这类目录跳转不要带上写死的 host:port
        absolute_redirect off;

        # 审计工具、部署配置、点文件都不是站点内容，不对外
        location ^~ /tools/  { deny all; }
        location ^~ /deploy/ { deny all; }
        location ~ /\.       { deny all; }
        location ~* \.(?:md|mjs|bak|orig|conf|py|sh|toml|yml|yaml|jsonl|log)$ { deny all; }

        # Service Worker 绝不能被缓存：本站靠改 sw.js 触发重新 install，
        # 一旦它被缓存住，新增页面永远进不了离线壳。
        location = /sw.js {
            expires    off;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # manifest 同理，改了要能马上生效
        location = /manifest.webmanifest {
            expires    off;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # HTML 走协商缓存。共享层靠 ?v=N 做版本锚，而"哪一版"写在 HTML 里，
        # 所以 HTML 本身必须每次回源核对，否则版本锚推不下去。
        location ~* \.html$ {
            expires    off;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # 共享层可以长缓存：浏览器 HTTP 缓存按含查询串的完整 URL 建键，
        # ?v=21 → ?v=22 就是另一个条目，不会取到旧的 CSS/JS。
        # 只用 expires，不要再叠一条 add_header Cache-Control：
        # 两者都会写 Cache-Control，叠起来会下发两个同名头（实测 max-age=2592000
        # 与 public, max-age=2592000 各一条），中间缓存对重复头的取舍并不一致。
        location ^~ /assets/ {
            expires    30d;
        }
        location ^~ /data/ {
            expires    30d;
        }

        try_files $uri $uri/ =404;
    }
}

# ---- 想让局域网里的平板也能装这个离线应用时 ----
# 1. 把 listen 改成 listen 8088;（去掉 127.0.0.1）并放行防火墙。
# 2. 但 http:// + 局域网 IP 不是安全上下文，assets/js/pwa.js 会静默跳过注册，
#    离线能力和"添加到主屏幕"都拿不到 —— 契约要求它静默降级，所以不会报错，
#    只是悄悄没有。要真正可用必须配 HTTPS（自签证书需在设备上安装并信任根证书，
#    或者用一个真实域名 + Let's Encrypt）。
# 3. 站点没有后端、不收集数据、进度只存在各自设备的 localStorage 里；
#    对外开放前仍需自行确认这是你想要的暴露面。
